<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'">
<meta name="description" content="Travel stories and photo diaries."><title>Travel Diaries · Creative Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee8dc;--paper2:#f5f0e7;--ink:#342b2b;--muted:#6c6060;--wine:#6a3044;--gold:#9b783d;--line:rgba(52,43,43,.17);--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 16%,rgba(155,120,61,.08),transparent 23%),var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
.page{width:min(1120px,calc(100% - 48px));margin:auto;padding:24px 0 80px}
.topline{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);font:500 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
.topline a,footer a{color:var(--wine);text-decoration:none}
.hero{display:grid;grid-template-columns:1fr 270px;gap:30px;align-items:end;padding:clamp(52px,8vw,88px) 0 32px;border-bottom:1px solid var(--line)}
.kicker,.meta,.count{color:var(--wine);font:500 .68rem var(--mono);letter-spacing:.16em;text-transform:uppercase}
h1{margin:10px 0 0;font:500 clamp(3.5rem,9vw,7rem)/.84 var(--serif);letter-spacing:-.05em}
.hero-note{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.archive{padding-top:38px}.archive-top{display:flex;justify-content:space-between;gap:18px;margin-bottom:18px;color:var(--muted);font:500 .65rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.post-card{min-width:0;overflow:hidden;background:rgba(245,240,231,.85);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 32px rgba(52,43,43,.06)}
.post-card.featured{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr)}
.post-image{display:block;min-width:0;min-height:260px;background:#d8d1c4}.post-image img{display:block;width:100%;height:100%;min-height:260px;object-fit:cover}
.post-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:clamp(22px,3vw,38px)}
.post-copy h2{margin:12px 0;color:var(--ink);font:500 clamp(2rem,4vw,3.4rem)/.95 var(--serif);letter-spacing:-.035em}
.post-copy p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.65}
.read-link{display:inline-flex;gap:8px;margin-top:22px;color:var(--wine);font:600 .67rem var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.read-link:hover{text-decoration:underline;text-underline-offset:4px}
.post-card:not(.featured) .post-image{min-height:210px;aspect-ratio:16/9}.post-card:not(.featured) .post-image img{min-height:210px}
.empty{padding:40px;border:1px dashed var(--line);text-align:center;color:var(--muted)}
footer{margin-top:58px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font:500 .65rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:12px}.post-card.featured{grid-template-columns:1fr}.post-card.featured .post-image,.post-card.featured .post-image img{min-height:230px;max-height:360px}.posts{grid-template-columns:1fr}}
@media(max-width:480px){.page{width:calc(100% - 28px);padding-top:16px}.topline{font-size:.58rem}.hero{padding:48px 0 24px}h1{font-size:clamp(3.3rem,16vw,5rem)}.archive{padding-top:26px}.post-copy{padding:21px}}
</style></head>
<body><main class="page">
<div class="topline"><a href="index.html">← Creative Side</a><span>Travel archive</span></div>
<header class="hero"><div><div class="kicker">Out of office · into the blue</div><h1>Travel diaries.</h1></div><p class="hero-note">Travel stories and photo diaries.</p></header>
<section class="archive" aria-label="Travel diary posts"><div class="archive-top"><span>From the journal</span><span class="count" id="postCount">Loading</span></div><div class="posts" id="travelPosts" aria-live="polite"></div></section>
<footer><a href="index.html">Back to Creative Side</a></footer></main>
<script>
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imgPath(s){s=String(s||"").trim();return /^assets\/[A-Za-z0-9._/-]+$/.test(s)?s:"";}
fetch("content/travel-diaries.json").then(r=>{if(!r.ok)throw new Error("load");return r.json();}).then(data=>{
 const posts=(data.posts||[]).filter(p=>p&&p.slug&&p.title&&p.published!==false);
 document.getElementById("postCount").textContent=String(posts.length).padStart(2,"0")+" "+(posts.length===1?"story":"stories");
 document.getElementById("travelPosts").innerHTML=posts.length?posts.map((p,i)=>{
  const href="travel-post.html?post="+encodeURIComponent(p.slug),img=imgPath(p.cover),meta=[p.date,p.locations].filter(Boolean).map(esc).join(" · ");
  return '<article class="post-card '+(i===0?"featured":"")+'"><a class="post-image" href="'+href+'" aria-label="Read '+esc(p.title)+'">'+(img?'<img src="'+esc(img)+'" alt="'+esc(p.coverAlt||p.title)+'" loading="'+(i===0?"eager":"lazy")+'">':"")+'</a><div class="post-copy"><div class="meta">'+meta+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||"")+'</p><a class="read-link" href="'+href+'">Read the diary ↗</a></div></article>';
 }).join(""):'<div class="empty">No travel stories have been added yet.</div>';
}).catch(()=>{document.getElementById("travelPosts").innerHTML='<div class="empty">The travel archive could not be loaded. Please refresh.</div>';document.getElementById("postCount").textContent="";});
</script></body></html>
