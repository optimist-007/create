<title>Art Gallery · Creative Side</title>
<style>
:root{--paper:#f3e8df;--ink:#3b2d29;--muted:#79665d;--line:rgba(59,45,41,.16);--accent:#a75f43}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto;padding:38px 0 72px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font:500 12px/1.4 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px}
header{padding:58px 0 34px;border-bottom:1px solid var(--line)}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(42px,7vw,76px);font-weight:400;letter-spacing:-.045em;margin:14px 0 12px}
.intro{font:15px/1.7 Arial,sans-serif;color:var(--muted);max-width:520px;margin:0}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,4vw,44px);padding-top:42px}
figure{margin:0;min-width:0}.art{background:#e9e1d3;padding:12px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(48,42,30,.08)}
.art img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#e9e1d3}
figcaption{padding:16px 2px 0}figcaption strong{display:block;font-size:25px;font-weight:400}
@media(max-width:650px){.wrap{width:min(100% - 28px,520px);padding-top:24px}.gallery{grid-template-columns:1fr;gap:30px;padding-top:28px}header{padding:44px 0 26px}.art{padding:8px}figcaption strong{font-size:22px}}

body{background:radial-gradient(ellipse at 10% 15%,#ead1c4 0,transparent 30%),radial-gradient(ellipse at 90% 70%,#d9c9b9 0,transparent 34%),#f3e8df}
.wrap{position:relative}.back a{color:var(--accent);text-decoration:none}.back a:hover{text-decoration:underline}
header{position:relative;padding:74px 0 42px}header:after{content:"";position:absolute;right:3%;top:28px;width:clamp(90px,16vw,170px);aspect-ratio:1;border:1px solid #a75f43;border-radius:50%;box-shadow:0 0 0 13px rgba(167,95,67,.07),0 0 0 27px rgba(167,95,67,.045);opacity:.65}
h1{font-size:clamp(4rem,10vw,8.4rem);line-height:.83;max-width:650px}
.gallery{grid-template-columns:1.12fr .88fr;align-items:start;gap:clamp(18px,4vw,52px);padding-top:38px}
figure:nth-child(2){margin-top:76px}
.art{padding:14px;background:linear-gradient(145deg,#f8eee5,#dfcbbd);border:1px solid rgba(120,73,54,.25);box-shadow:0 18px 38px rgba(83,53,42,.12);border-radius:3px}
figure:nth-child(2) .art{background:linear-gradient(145deg,#f1e6d2,#d8c7aa)}
.art img{transition:transform .35s ease}.art:hover img{transform:scale(1.015)}
figcaption{display:flex;align-items:center;gap:12px}figcaption:before{content:"";width:28px;height:1px;background:var(--accent)}
figcaption strong{font-size:clamp(24px,3vw,32px);color:var(--ink)}
@media(max-width:650px){.gallery{grid-template-columns:1fr}.gallery figure:nth-child(2){margin-top:0}header:after{right:2%;top:20px;opacity:.3}}


.creative-nav{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:13px 0 15px;border-bottom:1px solid var(--line);font:500 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase}
.creative-nav a{color:inherit;text-decoration:none;white-space:nowrap;transition:opacity .2s ease,color .2s ease}
.creative-nav a:hover{opacity:.68;text-decoration:underline;text-underline-offset:5px}
.creative-nav .nav-home{font-weight:600;letter-spacing:.13em}
.creative-nav .nav-links{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.8vw,22px);flex-wrap:wrap}
@media(max-width:760px){.creative-nav{align-items:flex-start;flex-direction:column;gap:12px}.creative-nav .nav-links{justify-content:flex-start;gap:9px 17px}}

/* Gallery: quiet exhibition wall, generous artwork scale and restrained labels */
body{background:#eee7dc!important}
.wrap{max-width:1320px!important}
header{display:grid;grid-template-columns:1fr auto;align-items:end;gap:28px;padding:clamp(48px,7vw,82px) 0 24px!important;border-bottom:1px solid var(--line)}
header:after{content:"01 / 02";position:static;display:block;width:auto;height:auto;aspect-ratio:auto;border:0;box-shadow:none;opacity:1;color:var(--accent);font: .72rem var(--mono);letter-spacing:.16em;align-self:end;padding-bottom:8px}
.gallery{grid-template-columns:1.15fr .85fr!important;gap:clamp(22px,5vw,72px)!important;padding-top:clamp(28px,4vw,54px)!important}
figure:nth-child(2){margin-top:clamp(35px,8vw,110px)!important}
.art{padding:clamp(9px,1.4vw,18px)!important;background:#e1d6c8!important;box-shadow:0 22px 55px rgba(50,39,31,.12)!important;border:1px solid rgba(70,54,42,.18)!important}
.art img{max-height:74vh!important;width:100%;object-fit:contain!important}
figcaption{padding-top:18px!important}
figcaption:before{display:none!important}
figcaption strong{font:400 clamp(25px,3.2vw,38px) var(--serif)!important}
@media(max-width:650px){header{grid-template-columns:1fr!important}.gallery{grid-template-columns:1fr!important}.gallery figure:nth-child(2){margin-top:0!important}.art img{max-height:none!important}}

</style>
