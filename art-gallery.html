<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e7"><title>The Gallery · Creative Side</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee9df;--wall:#e2dbcf;--ink:#302c28;--muted:#746b61;--line:#c9c0b3;--accent:#886b52;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:20px 0 60px}
.creative-nav{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0 15px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase}.nav-links{display:flex;gap:clamp(9px,1.7vw,20px);flex-wrap:wrap}.creative-nav a{text-decoration:none}.creative-nav a:hover{text-decoration:underline;text-underline-offset:4px}
.heading{padding:40px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.eyebrow{font:11px var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}h1{font:500 clamp(3.6rem,9vw,7.4rem)/.83 var(--serif);letter-spacing:-.055em;margin:12px 0 0}
.disclaimer{margin:20px 0 0;padding:15px 18px;border:1px solid #b8a58e;background:#e7dfd2;color:#453c33;font:600 clamp(12px,1.6vw,15px)/1.5 var(--sans);letter-spacing:.025em;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.5vw,28px);padding-top:32px;align-items:start}
figure{margin:0;min-width:0}figure:nth-child(2){margin-top:35px}figure:nth-child(3){margin-top:70px}
.frame{background:#f5f0e7;padding:clamp(9px,1.3vw,15px);border:1px solid #c7bba9;box-shadow:0 14px 28px #3e34251c, inset 0 0 0 2px #fffaf1}
.frame img{display:block;width:100%;height:clamp(210px,28vw,370px);object-fit:contain;background:#e8e0d3}
figcaption{padding:12px 2px 0;font:500 22px var(--serif);color:var(--ink)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
@media(max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:start;flex-direction:column}figure:nth-child(2),figure:nth-child(3){margin-top:0}}
@media(max-width:480px){.page{width:calc(100% - 26px)}.gallery{grid-template-columns:1fr;gap:25px}.frame img{height:auto;max-height:72vh}footer{flex-direction:column}}
.bottom-spaces{margin-top:30px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.bottom-spaces .nav-home{color:var(--accent);font-weight:700}@media(max-width:760px){.bottom-spaces{align-items:flex-start;flex-direction:column;gap:12px}}\n
/* Shared navigation system: identical structure, spacing and link behaviour on every page */
.creative-nav{position:relative!important;z-index:20!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;width:100%!important;box-sizing:border-box!important;margin:0 0 26px!important;padding:15px 0 16px!important;border:0!important;border-bottom:1px solid rgba(85,91,79,.28)!important;border-radius:0!important;background:transparent!important;font:500 11px/1.35 Arial,sans-serif!important;letter-spacing:.045em!important;text-transform:none!important}
.creative-nav a{display:inline-flex!important;align-items:center!important;min-height:28px!important;padding:5px 0!important;color:inherit!important;text-decoration:none!important;white-space:nowrap!important;opacity:.86!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;transition:opacity .18s ease,border-color .18s ease!important}
.creative-nav a:hover,.creative-nav a:focus-visible{opacity:1!important;text-decoration:underline!important;text-underline-offset:5px!important}
.creative-nav .nav-home{font-weight:700!important;letter-spacing:.035em!important;margin-right:14px!important}
.creative-nav .nav-links{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:clamp(12px,2vw,25px)!important;flex-wrap:wrap!important}
@media(max-width:850px){.creative-nav{align-items:flex-start!important;flex-direction:column!important;gap:8px!important;margin-bottom:20px!important}.creative-nav .nav-links{justify-content:flex-start!important;gap:6px 18px!important}}
@media(max-width:420px){.creative-nav{font-size:10px!important}.creative-nav .nav-links{gap:4px 13px!important}}
