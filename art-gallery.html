<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e7">
<title>Art Gallery · Creative Side</title>
<style>
:root{--paper:#f5f0e7;--ink:#292820;--muted:#777365;--line:rgba(55,50,39,.16);--accent:#9b7650}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto;padding:38px 0 72px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font:500 12px/1.4 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px}
header{padding:58px 0 34px;border-bottom:1px solid var(--line)}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(42px,7vw,76px);font-weight:400;letter-spacing:-.045em;margin:14px 0 12px}
.intro{font:15px/1.7 Arial,sans-serif;color:var(--muted);max-width:520px;margin:0}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,4vw,44px);padding-top:42px}
figure{margin:0;min-width:0}.art{background:#e9e1d3;padding:12px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(48,42,30,.08)}
.art img{display:block;width:100%;height:auto;max-height:680px;object-fit:contain;background:#e9e1d3}
figcaption{padding:16px 2px 0}figcaption strong{display:block;font-size:25px;font-weight:400}figcaption span{display:block;margin-top:5px;color:var(--muted);font:11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:650px){.wrap{width:min(100% - 28px,520px);padding-top:24px}.gallery{grid-template-columns:1fr;gap:30px;padding-top:28px}header{padding:44px 0 26px}.art{padding:8px}figcaption strong{font-size:22px}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="./index.html">← Back to Creative Side</a>
<header><div class="eyebrow">A little corner of making</div><h1>Art Gallery</h1><p class="intro">Drawings, colours and things I felt like putting on paper.</p></header>
<section class="gallery" aria-label="Artwork">
<figure><div class="art"><img src="./assets/aurora-pastel-art.jpg" alt="Blue and green pastel artwork inspired by the northern lights"></div><figcaption><strong>Northern Lights</strong><span>Pastel artwork</span></figcaption></figure>
<figure><div class="art"><img src="./assets/krishna-yashoda-sketch.jpg" alt="Pencil drawing of Krishna with Yashoda"></div><figcaption><strong>Krishna Ji</strong><span>Pencil sketch</span></figcaption></figure>
</section>
</main></body></html>
