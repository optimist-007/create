<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee9df;--wall:#e2dbcf;--ink:#302c28;--muted:#746b61;--line:#c9c0b3;--accent:#886b52;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:20px 0 60px}
.creative-nav{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0 15px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase}.nav-links{display:flex;gap:clamp(9px,1.7vw,20px);flex-wrap:wrap}.creative-nav a{text-decoration:none}.creative-nav a:hover{text-decoration:underline;text-underline-offset:4px}
.heading{padding:40px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.eyebrow{font:11px var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}h1{font:500 clamp(3.6rem,9vw,7.4rem)/.83 var(--serif);letter-spacing:-.055em;margin:12px 0 0}

.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.5vw,28px);padding-top:32px;align-items:start}

.frame{background:#f5f0e7;padding:clamp(9px,1.3vw,15px);border:1px solid #c7bba9;box-shadow:0 14px 28px #3e34251c, inset 0 0 0 2px #fffaf1}
.frame img{display:block;width:100%;height:clamp(210px,28vw,370px);object-fit:contain;background:#e8e0d3}
figcaption{padding:12px 2px 0;font:500 22px var(--serif);color:var(--ink)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
@media(max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:start;flex-direction:column}figure:nth-child(2),figure:nth-child(3){margin-top:0}}
@media(max-width:480px){.page{width:calc(100% - 26px)}.gallery{grid-template-columns:1fr;gap:25px}.frame img{height:auto;max-height:72vh}footer{flex-direction:column}}
