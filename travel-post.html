/* CREATIVE SIDE: shared visual rhythm, motion and compact spacing */
:root{scroll-behavior:smooth}
body{position:relative;isolation:isolate}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 8% 12%,rgba(194,166,128,.12),transparent 34%),radial-gradient(ellipse at 92% 78%,rgba(119,145,125,.11),transparent 32%);animation:ambientDrift 18s ease-in-out infinite alternate}
@keyframes ambientDrift{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,1%,0) scale(1.035)}}
@keyframes softRise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
:where(.page,.wrap){padding-bottom:clamp(28px,4vw,48px)!important}
:where(.section,.episodes,.shelf,.archive,.thought-index,.journal-bottom,.lately-section,.art-gallery-section,.travel-diaries-section,.extra-section){margin-top:clamp(20px,3vw,34px)!important}
:where(.section-head,.episodes-head,.library-head,.archive-top,.thought-index-head){margin-bottom:clamp(10px,1.5vw,16px)!important}
:where(.category-grid,.recipe-grid,.episode-grid,.thought-grid,.postcard-grid,.place-grid,.wishlist-grid,.experiment-grid,.project-grid,.art-gallery-grid,.quote-grid,.lately-grid,.journal-shelf,.archive-strip){gap:clamp(10px,1.35vw,16px)!important}
:where(.category,.recipe-card,.post-card,.thought-tile,.archive-card,.media-entry,.journal-card,.lately-card,.quote-card,.artwork-card,.place-card,.note-card,.wishlist-item,.cassette,.episode,.experiment-tile,.playlist-item){transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;animation:softRise .55s both}
:where(.category,.recipe-card,.post-card,.thought-tile,.archive-card,.media-entry,.journal-card,.lately-card,.quote-card,.artwork-card,.place-card,.note-card,.wishlist-item,.cassette,.episode,.experiment-tile,.playlist-item):hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(49,57,45,.10)}
:where(.category,.recipe-card,.post-card,.thought-tile,.archive-card,.media-entry,.journal-card,.lately-card,.quote-card,.artwork-card,.place-card,.note-card,.wishlist-item,.cassette,.episode,.experiment-tile,.playlist-item):focus-within{outline:1px solid rgba(113,129,107,.45);outline-offset:2px}
:where(a,button){-webkit-tap-highlight-color:transparent}
:where(a,button):focus-visible{outline:2px solid #71816b!important;outline-offset:3px!important}
:where(.creative-nav a,.nav-links a,.nav-pages a){transition:color .2s ease,opacity .2s ease,text-decoration-color .2s ease}
:where(img,.poster,.post-image,.story-image,.frame,.cover,.recipe-art,.journal-thumb){transition:transform .45s ease,filter .45s ease}
:where(.artwork-card,.post-card,.recipe-card,.journal-card):hover :where(img,.poster,.post-image,.story-image,.frame,.cover,.recipe-art,.journal-thumb){filter:saturate(1.06)}
:where(.hero,.mast,.podcast-scene,.lounge,.room){animation:softRise .7s ease both}
:where(.eyebrow,.tiny-label,.small-label,.section-kicker){letter-spacing:.14em}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<main class="page">
<nav class="creative-nav" aria-label="Creative Side navigation"><a class="nav-brand" href="index.html">CREATIVE SIDE</a><div class="nav-pages"><a href="art-gallery.html">ART GALLERY</a><a href="travel-diaries.html">TRAVEL DIARIES</a><a href="words-and-thoughts.html">WORDS &amp; THOUGHTS</a><a href="music-room.html">MUSIC ROOM</a><a href="podcast-corner.html">PODCAST CORNER</a><a href="kitchen-stories.html">KITCHEN STORIES</a></div></nav><div class="topline"><a href="travel-diaries.html">← All travel diaries</a><a href="index.html">Creative Side</a></div><div id="articleRoot"><div class="error">Loading travel story…</div></div></main>
<script>
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imgPath(s){s=String(s||"").trim();return /^assets\/[A-Za-z0-9._% -]+$/.test(s)?s:"";}
function blockHtml(b){
 if(!b||typeof b!=="object")return "";
 if(b.type==="heading")return "<h2>"+esc(b.text)+"</h2>";
 if(b.type==="paragraph")return "<p>"+esc(b.text).replace(/\n/g,"<br>")+"</p>";
 if(b.type==="image"){const src=imgPath(b.src);return src?'<figure class="story-image"><img src="'+esc(src)+'" alt="'+esc(b.alt||"Travel photograph")+'">'+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':"")+'</figure>':"";}
 return "";
}
function render(data,slug){
 const p=(data.posts||[]).find(x=>x&&x.slug===slug&&x.published!==false),root=document.getElementById("articleRoot");
 if(!p){root.innerHTML='<div class="error"><h1>Story not found</h1><p>This travel diary is not available.</p><a href="travel-diaries.html">Return to Travel Diaries</a></div>';return;}
 document.title=p.title+" · Travel Diaries";
 const gallery=Array.isArray(p.gallery)?p.gallery.filter(g=>imgPath(g.src)):[];
 root.innerHTML='<header class="head"><div class="meta">'+esc([p.date,p.locations].filter(Boolean).join(" · "))+'</div><h1>'+esc(p.title)+'</h1></header>'+
 
 '<article class="story">'+(p.body||[]).map(blockHtml).join("")+'</article>'+
 (gallery.length?'<section class="gallery" aria-label="Travel photographs">'+gallery.map(g=>'<figure><img src="'+esc(imgPath(g.src))+'" alt="'+esc(g.alt||"Travel photograph")+'">'+(g.caption?'<figcaption>'+esc(g.caption)+'</figcaption>':"")+'</figure>').join("")+'</section>':"");
}
const slug=new URLSearchParams(window.location.search).get("post")||"";
fetch("content/travel-diaries.json").then(r=>{if(!r.ok)throw new Error("load");return r.json();}).then(d=>render(d,slug)).catch(()=>{document.getElementById("articleRoot").innerHTML='<div class="error"><h1>Could not load this story</h1><a href="travel-diaries.html">Travel Diaries</a></div>';});
</script></body></html>
