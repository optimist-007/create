<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'">
<meta name="description" content="A travel story from Creative Side."><title>Travel story · Creative Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee8dc;--paper2:#f5f0e7;--ink:#342b2b;--muted:#6c6060;--wine:#6a3044;--line:rgba(52,43,43,.17);--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans)}
.page{width:min(1100px,calc(100% - 48px));margin:auto;padding:24px 0 80px}
.topline{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);font:500 .67rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
.topline a,.bottom a{color:var(--wine);text-decoration:none}
.head{text-align:center;padding:clamp(34px,5vw,58px) 0 20px}.meta{color:var(--wine);font:500 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase}
h1{max-width:900px;margin:14px auto 0;font:500 clamp(2.7rem,6vw,5rem)/.92 var(--serif);letter-spacing:-.045em}
.cover{margin:0 auto 48px;padding:12px;background:var(--paper2);border:1px solid var(--line);box-shadow:0 18px 42px rgba(52,43,43,.09)}
.cover img{display:block;width:100%;height:auto;max-height:680px;object-fit:contain}
.story{max-width:790px;margin:auto;color:#4e4444;font-size:1rem;line-height:1.68}.story p{margin:0 0 .78em}
.story h2{margin:1.25em 0 .35em;color:var(--wine);font:500 clamp(1.9rem,3.5vw,2.65rem)/1 var(--serif);letter-spacing:-.02em}
.story-image{margin:30px 0;padding:9px;background:var(--paper2);border:1px solid var(--line)}.story-image img{display:block;width:100%;height:auto}.story-image figcaption{margin:8px 2px 0;color:var(--muted);font-size:.82rem}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:32px auto;max-width:900px}.gallery figure{margin:0;padding:8px;background:var(--paper2);border:1px solid var(--line)}.gallery img{display:block;width:100%;height:260px;object-fit:cover}.gallery figcaption{margin:7px 2px 0;color:var(--muted);font-size:.78rem}
.bottom{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font:500 .67rem var(--mono);letter-spacing:.1em;text-transform:uppercase}
.error{max-width:640px;margin:90px auto;text-align:center;color:var(--muted)}
@media(max-width:640px){.page{width:calc(100% - 28px);padding:16px 0 56px}.topline{font-size:.57rem}.head{padding:42px 0 22px}h1{font-size:clamp(2.7rem,12vw,4rem)}.cover{padding:6px}.story{font-size:.96rem;line-height:1.75}.gallery{grid-template-columns:1fr}.gallery img{height:auto;max-height:420px;object-fit:contain}}

body{background:linear-gradient(150deg,#e7efec,#f4f7f2 62%,#e3ece8)}
.cover{border-radius:3px 20px 3px 20px;box-shadow:0 20px 44px rgba(41,61,58,.12)}
.story h2{position:relative;padding-left:16px}.story h2:before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:#386b63}
.story-image,.gallery figure{border-radius:3px 14px 3px 14px;box-shadow:0 10px 25px rgba(41,61,58,.07)}
.bottom{border-color:rgba(41,61,58,.2)}

/* One shared editorial masthead across every Creative Side page */
.creative-nav{position:relative!important;z-index:50!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:28px!important;width:100%!important;min-height:80px!important;margin:0 0 30px!important;padding:22px 0 20px!important;border:0!important;border-bottom:1px solid rgba(57,49,43,.28)!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;font-family:"DM Mono","Courier New",monospace!important;font-size:clamp(10px,.94vw,14px)!important;line-height:1.4!important;letter-spacing:.055em!important;text-transform:uppercase!important}
.creative-nav a{display:inline-block!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:inherit!important;text-decoration:none!important;white-space:nowrap!important;opacity:1!important;transition:opacity .18s ease,text-decoration-color .18s ease!important}
.creative-nav a:hover,.creative-nav a:focus-visible{opacity:.62!important;text-decoration:underline!important;text-underline-offset:5px!important}
.creative-nav .nav-brand{font-weight:700!important;letter-spacing:.035em!important}
.creative-nav .nav-pages{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:clamp(14px,2.25vw,38px)!important;flex-wrap:wrap!important}
@media(max-width:900px){.creative-nav{align-items:flex-start!important;flex-direction:column!important;gap:14px!important;padding:18px 0!important}.creative-nav .nav-pages{justify-content:flex-start!important;gap:10px 22px!important}}
@media(max-width:520px){.creative-nav{min-height:0!important;margin-bottom:22px!important}.creative-nav .nav-pages{gap:9px 15px!important;font-size:10px!important}}

</style></head>
<body>
<nav class="creative-nav" aria-label="Creative Side navigation">
<a class="nav-brand" href="index.html">CREATIVE SIDE</a>
<div class="nav-pages">
<a href="art-gallery.html">ART GALLERY</a>
<a href="travel-diaries.html">TRAVEL DIARIES</a>
<a href="words-and-thoughts.html">WORDS &amp; THOUGHTS</a>
<a href="music-room.html">MUSIC ROOM</a>
<a href="podcast-corner.html">PODCAST CORNER</a>
<a href="kitchen-stories.html">KITCHEN STORIES</a>
</div>
</nav><main class="page"><div class="topline"><a href="travel-diaries.html">← All travel diaries</a><a href="index.html">Creative Side</a></div><div id="articleRoot"><div class="error">Loading travel story…</div></div></main>
<script>
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imgPath(s){s=String(s||"").trim();return /^assets\/[A-Za-z0-9._% -]+$/.test(s)?s:"";}
function blockHtml(b){
 if(!b||typeof b!=="object")return "";
 if(b.type==="heading")return "<h2>"+esc(b.text)+"</h2>";
 if(b.type==="paragraph")return "<p>"+esc(b.text).replace(/\n/g,"<br>")+"</p>";
 if(b.type==="image"){const src=imgPath(b.src);return src?'<figure class="story-image"><img src="'+esc(src)+'" alt="'+esc(b.alt||"Travel photograph")+'">'+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':"")+'</figure>':"";}
 return "";
}
function render(data,slug){
 const p=(data.posts||[]).find(x=>x&&x.slug===slug&&x.published!==false),root=document.getElementById("articleRoot");
 if(!p){root.innerHTML='<div class="error"><h1>Story not found</h1><p>This travel diary is not available.</p><a href="travel-diaries.html">Return to Travel Diaries</a></div>';return;}
 document.title=p.title+" · Travel Diaries";
 const gallery=Array.isArray(p.gallery)?p.gallery.filter(g=>imgPath(g.src)):[];
 root.innerHTML='<header class="head"><div class="meta">'+esc([p.date,p.locations].filter(Boolean).join(" · "))+'</div><h1>'+esc(p.title)+'</h1></header>'+
 
 '<article class="story">'+(p.body||[]).map(blockHtml).join("")+'</article>'+
 (gallery.length?'<section class="gallery" aria-label="Travel photographs">'+gallery.map(g=>'<figure><img src="'+esc(imgPath(g.src))+'" alt="'+esc(g.alt||"Travel photograph")+'">'+(g.caption?'<figcaption>'+esc(g.caption)+'</figcaption>':"")+'</figure>').join("")+'</section>':"");
}
const slug=new URLSearchParams(window.location.search).get("post")||"";
fetch("content/travel-diaries.json").then(r=>{if(!r.ok)throw new Error("load");return r.json();}).then(d=>render(d,slug)).catch(()=>{document.getElementById("articleRoot").innerHTML='<div class="error"><h1>Could not load this story</h1><a href="travel-diaries.html">Travel Diaries</a></div>';});
</script></body></html>
