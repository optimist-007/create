<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Personal writing, reflections and thoughts.">
<title>Words &amp; Thoughts · Creative Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee8dc;--paper2:#f5f0e7;--ink:#342b2b;--muted:#6c6060;--wine:#6a3044;--gold:#9b783d;--line:rgba(52,43,43,.17);--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 16%,rgba(155,120,61,.08),transparent 23%),var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
.page{width:min(1040px,calc(100% - 48px));margin:auto;padding:24px 0 76px}
.topline{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);font:500 .67rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
a{color:var(--wine);text-decoration:none}.topline a:hover,.back:hover{text-decoration:underline;text-underline-offset:4px}
.hero{padding:clamp(48px,8vw,82px) 0 28px;border-bottom:1px solid var(--line)}
.kicker,.entry-meta{color:var(--wine);font:500 .67rem var(--mono);letter-spacing:.15em;text-transform:uppercase}
h1{margin:12px 0 8px;font:500 clamp(3.5rem,9vw,7rem)/.86 var(--serif);letter-spacing:-.055em}
.hero p{max-width:560px;margin:14px 0 0;color:var(--muted);font-size:.96rem}
.entries{display:grid;gap:18px;padding-top:28px}
.entry{padding:clamp(22px,4vw,38px);background:var(--paper2);border:1px solid var(--line);box-shadow:0 12px 28px rgba(52,43,43,.055);border-radius:12px}
.entry h2{margin:8px 0 18px;font:500 clamp(2rem,4vw,3.25rem)/.98 var(--serif);letter-spacing:-.035em}
.entry-body{max-width:790px;color:#514747;font-size:.98rem;line-height:1.72}
.entry-body p{margin:0 0 .85em}.entry-body p:last-child{margin-bottom:0}
.empty{padding:28px;border:1px dashed var(--line);color:var(--muted)}
footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font:500 .65rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
@media(max-width:600px){.page{width:calc(100% - 28px);padding-top:16px}.hero{padding:44px 0 24px}.entry{padding:21px}.entry-body{font-size:.95rem;line-height:1.68}}
</style>
</head>
<body><main class="page">
<div class="topline"><a href="index.html">← Creative Side</a><span>Personal writing</span></div>
<header class="hero"><div class="kicker">Notes from the margins</div><h1>Words &amp; Thoughts.</h1><p>A place for reflections, observations, personal essays and thoughts worth putting into words.</p></header>
<section class="entries" id="entries" aria-live="polite"><div class="empty">Loading writing…</div></section>
<footer><a href="index.html">Back to Creative Side</a></footer>
</main>
<script>
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(data){
 const entries=Array.isArray(data.mediaEntries)?data.mediaEntries.filter(x=>x&&x.enabled!==false&&String(x.collection||"").toLowerCase()==="journal"&&String(x.text||"").trim()):[];
 const host=document.getElementById("entries");
 host.innerHTML=entries.length?entries.map(x=>{
  const paragraphs=String(x.text||"").trim().split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  return '<article class="entry"><div class="entry-meta">'+esc(x.mediaType||"Reflection")+(x.date?" · "+esc(x.date):"")+'</div><h2>'+esc(x.title||"Untitled")+'</h2><div class="entry-body">'+paragraphs.map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("")+'</div></article>';
 }).join(""):'<div class="empty">New writing will find its way here.</div>';
}
fetch("content/creative-content.json").then(r=>{if(!r.ok)throw new Error("load");return r.json();}).then(render).catch(()=>{document.getElementById("entries").innerHTML='<div class="empty">The writing collection could not be loaded. Please refresh.</div>';});
</script></body></html>
